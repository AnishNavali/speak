[package]
name = "speak"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Local Gemma-powered push-to-talk dictation"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.17"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
cpal = "0.15"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
enigo = "0.6"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
minisign-verify = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", features = ["libei_tokio"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast"] }
x11rb = "0.13"
arboard = { version = "3", features = ["wayland-data-control"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
