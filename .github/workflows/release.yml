name: Public release (unsigned beta by default)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15, target: x86_64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      SPEAK_RELEASE_REPOSITORY: ${{ github.repository }}
      SPEAK_UPDATER_PUBLIC_KEY: ${{ vars.SPEAK_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.SPEAK_OS_SIGNING == 'true' && vars.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_API_KEY: ${{ vars.SPEAK_OS_SIGNING == 'true' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_ISSUER: ${{ vars.SPEAK_OS_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
      AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
      AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
      AZURE_SIGNING_SUBSCRIPTION_ID: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with: {targets: '${{ matrix.target }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev libxkbcommon-dev libdbus-1-dev libvulkan1
      - name: Prepare ephemeral Apple signing keychain
        if: runner.os == 'macOS' && vars.SPEAK_OS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: python scripts/setup-apple-signing.py
      - name: Validate public release configuration
        run: python scripts/release.py configure --public ${{ vars.SPEAK_OS_SIGNING == 'true' && '--os-signing' || '' }} --target ${{ matrix.target }}
      - run: cargo test --locked -p speak
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
        shell: bash
      - run: python scripts/bundle-runtime.py --target ${{ matrix.target }}
      - name: Sign all bundled Mac native helpers and libraries
        if: runner.os == 'macOS'
        run: python scripts/sign-macos-runtime.py ${{ vars.SPEAK_OS_SIGNING != 'true' && '--ad-hoc' || '' }}
      - name: Compile Windows app before Authenticode signing
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        run: npx --yes @tauri-apps/cli@2.12.3 build --no-bundle --target ${{ matrix.target }} --config target/release-config.json
      - name: Azure signing login (OIDC; no exported code-signing key)
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows application
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\speak.exe
      - name: Sign Windows native runtime libraries
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\runtime
          files-folder-filter: exe,dll
          files-folder-recurse: true
          append-signature: true
      - name: Bundle Windows installer from already-signed binaries
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        run: npx --yes @tauri-apps/cli@2.12.3 bundle --target ${{ matrix.target }} --config target/release-config.json
      - name: Sign final Windows installer
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\${{ matrix.target }}\release\bundle\nsis
          files-folder-filter: exe
      - name: Verify final Windows Authenticode signatures
        if: runner.os == 'Windows' && vars.SPEAK_OS_SIGNING == 'true'
        shell: pwsh
        run: |
          $files = @("target/${{ matrix.target }}/release/speak.exe") + @(Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | ForEach-Object FullName)
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "Invalid Authenticode signature: $file" }
          }
      - name: Build packages (notarize Mac only when OS signing is enabled)
        if: runner.os != 'Windows' || vars.SPEAK_OS_SIGNING != 'true'
        run: npx --yes @tauri-apps/cli@2.12.3 build --target ${{ matrix.target }} --config target/release-config.json
      - name: Verify Mac bundle integrity (including ad-hoc beta signatures)
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "target/${{ matrix.target }}/release/bundle/macos/Speak.app"
      - name: Verify Mac notarization ticket and publisher trust
        if: runner.os == 'macOS' && vars.SPEAK_OS_SIGNING == 'true'
        run: |
          xcrun stapler validate "target/${{ matrix.target }}/release/bundle/macos/Speak.app"
          spctl --assess --type execute --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/Speak.app"
      - name: Collect final artifacts and sign updater bytes
        run: python scripts/release.py collect --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
      - name: Clean up ephemeral Apple credentials
        if: always() && runner.os == 'macOS' && vars.SPEAK_OS_SIGNING == 'true'
        shell: bash
        run: |
          if [ -n "$SPEAK_TEMP_KEYCHAIN" ]; then security delete-keychain "$SPEAK_TEMP_KEYCHAIN"; fi
          if [ -n "$APPLE_API_KEY_PATH" ]; then rm -f "$APPLE_API_KEY_PATH"; fi
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/artifacts
      - run: python scripts/release.py merge
      - name: Create draft release only after all four targets succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          OS_SIGNING: ${{ vars.SPEAK_OS_SIGNING }}
        run: |
          title="Speak $RELEASE_TAG"
          notes=()
          if [ "$OS_SIGNING" != "true" ]; then
            title="$title (unsigned beta)"
            notes=(--notes-file docs/BETA_INSTALLATION.md)
          fi
          gh release create "$RELEASE_TAG" dist/release/* --draft --verify-tag --title "$title" --generate-notes "${notes[@]}"
