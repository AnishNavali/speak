<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speak microphone</title><link rel="stylesheet" href="indicator.css"><link rel="stylesheet" href="waveform.css"><script type="module" src="indicator.js"></script></head>
<body><button id="drag-handle" data-tauri-drag-region="deep" aria-label="Drag to move microphone" title="Drag to move"><svg viewBox="0 0 12 24" width="12" height="24" aria-hidden="true" fill="currentColor"><circle cx="3" cy="6" r="1.5"/><circle cx="9" cy="6" r="1.5"/><circle cx="3" cy="12" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="3" cy="18" r="1.5"/><circle cx="9" cy="18" r="1.5"/></svg></button><button id="mic" aria-label="Hold microphone to dictate" title="Hold to speak, release to insert"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3" fill="currentColor"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span id="status" data-tauri-drag-region role="status" aria-live="polite" title="Drag to move">Starting</span><div id="waveform" class="waveform" data-tauri-drag-region="deep" aria-hidden="true" title="Recording · drag to move"><svg viewBox="0 0 240 32" preserveAspectRatio="none"><path d="M0 16 C10 0 20 0 30 16 S50 32 60 16 S80 0 90 16 S110 32 120 16 S140 0 150 16 S170 32 180 16 S200 0 210 16 S230 32 240 16"/></svg></div><button id="cancel" aria-label="Close floating microphone" title="Close microphone and cancel dictation">×</button></body></html>
